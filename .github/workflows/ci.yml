name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CXX=clang++" >> "$GITHUB_ENV"
          else
            echo "CXX=g++" >> "$GITHUB_ENV"
          fi
      - name: Configure
        run: cmake --preset debug
      - name: Build
        run: cmake --build --preset debug
      - name: Test
        run: ctest --preset debug

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset msvc
      - name: Build
        run: cmake --build --preset msvc-debug
      - name: Test
        run: ctest --preset msvc-debug
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build GUI
        run: dotnet build gui/GcodeAnalyzer.sln -c Release
      - name: Test GUI
        run: dotnet test gui/GcodeAnalyzer.sln -c Release --no-build

  package:
    needs: [linux, windows]
    # упаковка только по тегу v* или ручному запуску (экономия минут Actions)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write   # публикация релиза при теге v*
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Package (version from tag v* if present)
        shell: powershell
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF_NAME.Substring(1)
            powershell -ExecutionPolicy Bypass -File scripts/package.ps1 -Version $v -Variant all
          } else {
            powershell -ExecutionPolicy Bypass -File scripts/package.ps1 -Variant all
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check CLI has no VC runtime dependencies
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/check-deps.ps1 -Exe build/package/Release/gcode-analyzer.exe
      - name: Check CET for standard GUI, compat GUI and CLI
        shell: powershell
        run: |
          & scripts/check-cet.ps1 -Exe build/package-gui-standard/GcodeAnalyzerGui.exe -Expect on
          & scripts/check-cet.ps1 -Exe build/package-gui-compat/GcodeAnalyzerGui.exe -Expect off
          & scripts/check-cet.ps1 -Exe build/package/Release/gcode-analyzer.exe -Expect off
      - name: Smoke test both packages in folders with Cyrillic names and spaces
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $version = (Get-Content VERSION -TotalCount 1).Trim()
          foreach ($suffix in @('', '-compat')) {
            & scripts/smoke-package.ps1 -Zip "dist/gcode-analyzer-$version-win-x64$suffix.zip"
          }
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        with:
          name: gcode-analyzer-win-x64
          path: dist/*.zip
          retention-days: 7
      - name: GitHub Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
